<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0A" />
    <title>ReelWave — Télécharge n'importe quelle vidéo</title>
    <meta name="description" content="Télécharge des vidéos YouTube, TikTok, Instagram, Pinterest et Twitter/X en 4K, 1080p ou MP3. Gratuit, sans pub, sans compte." />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Open Graph (aperçu Google / réseaux sociaux) -->
    <meta property="og:title"       content="ReelWave — Télécharge n'importe quelle vidéo" />
    <meta property="og:description" content="YouTube, TikTok, Instagram, Pinterest, Twitter/X — jusqu'en 4K. Gratuit, sans pub, sans compte." />
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://reelwave.fr" />
    <meta name="twitter:card"       content="summary" />
    <meta name="twitter:title"      content="ReelWave — Télécharge n'importe quelle vidéo" />
    <meta name="twitter:description" content="YouTube, TikTok, Instagram, Pinterest, Twitter/X — jusqu'en 4K. Gratuit, sans pub, sans compte." />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { width: 100%; height: 100%; overflow: hidden; background: #0A0A0A; }
      body { font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
